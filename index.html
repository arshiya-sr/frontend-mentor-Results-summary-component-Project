<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link href="styles.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Results summary component</title>
</head>

<body>
  <main class="main">
    <article class="card">
      <div class="top-section">
        <h1 class="card-title">Your Result</h1>
        <div class="score-circle">
          <p>76 </p>
          <p>of 100</p>
        </div>
        <b class="level">Great</b>
        <p class="level-desc">You scored higher than 65% of the people who have taken these tests.</p>
      </div>
      <div class="bottom-section">
        <h2 class="subtitle">Summary</h2>
        <div class="score-bar reaction">
          <div><img alt="red bolt icon" class="icon" src="./assets/images/icon-reaction.svg"><strong>Reaction</strong>
          </div>
          <p>80 <span class="of">/ 100</span></p>
        </div>
        <div class="score-bar memory">
          <div><img alt="yellow brain icon" class="icon" src="./assets/images/icon-memory.svg"><strong>Memory</strong>
          </div>
          <p>92 <span class="of">/ 100</span></p>
        </div>
        <div class="score-bar verbal">
          <div><img alt="green empty message icon" class="icon"
              src="./assets/images/icon-verbal.svg"><strong>Verbal</strong>
          </div>
          <p>61 <span class="of">/ 100</span></p>
        </div>
        <div class="score-bar visual">
          <div><img alt="blue one open-eye icon" class="icon"
              src="./assets/images/icon-visual.svg"><strong>Visual</strong></div>
          <p>72 <span class="of">/ 100</span></p>
        </div>
        <button class="continue-btn">
          Continue
        </button>
      </div>
    </article>
  </main>
  <footer class="footer">
    <p>Challenge by <a rel="noopener noreferrer" target="_blank"
        href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.</p>
    <p>Coded by <a rel="noopener noreferrer" target="_blank" href="https://github.com/arshiya-sr">Arshiya_sr</a>.</p>
  </footer>
</body>

</html>
